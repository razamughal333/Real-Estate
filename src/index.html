<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAZA ESTATE</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="output.css" rel="stylesheet" />
  </head>
  <body class="bg-zinc-950 text-white">
    <div
      id="announcement-bar"
      class="bg-zinc-900 border-b border-zinc-800 pt-3 pb-3 pl-6 pr-6 flex flex-wrap items-center justify-center gap-2 text-[14px] text-gray-300 relative"
    >
      <span class="text-yellow-400"
        ><i class="fa-solid fa-wand-magic-sparkles"></i
      ></span>

      <span>Discover Your Dream Property with Raza Estate</span>

      <a
        href="#"
        class="underline underline-offset-2 text-violet-400 ml-1 hover:text-violet-300 transition-colors duration-200"
      >
        Learn More
      </a>

      <button
        id="close-bar"
        class="absolute right-4 text-gray-500 hover:text-white text-xl transition-colors"
        aria-label="Close"
      >
        &times;
      </button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
